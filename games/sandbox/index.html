<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sand Box — PIXEL ARCADE</title>
  <link rel="icon" href="../../favicon.svg">
  <link rel="stylesheet" href="../../shared/retro.css">
  <style>
    #game { width: 800px; cursor: crosshair; touch-action: none; }
    .layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 12px;
    }
    .panel {
      margin-top: 24px;
      width: 230px;
      background: var(--panel);
      border: 4px solid var(--orange);
      box-shadow: 6px 6px 0 #000;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: stage-in 0.5s 0.1s cubic-bezier(.2,1.6,.4,1) both;
    }
    .panel h3 {
      margin: 0;
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--orange);
    }
    .elements { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .el {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--pixel);
      font-size: 8px;
      color: var(--white);
      background: #0e0720;
      border: 2px solid #3a2a60;
      padding: 6px 5px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.08s, border-color 0.15s;
    }
    .el:hover { border-color: var(--cyan); transform: translateY(-2px); }
    .el.active { border-color: var(--yellow); background: #2a1a4a; box-shadow: 0 0 10px rgba(255,230,0,0.4); }
    .el i { width: 12px; height: 12px; flex: none; border: 1px solid #000; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row .btn { font-size: 9px; padding: 8px; flex: 1; text-align: center; }
    input[type=range] { width: 100%; accent-color: var(--orange); }
    .info { font-size: 18px; color: var(--dim); line-height: 1.1; }
    .info b { color: var(--cyan); font-weight: normal; }
  </style>
</head>
<body class="crt game-page">
  <header class="game-bar">
    <a class="btn" href="../../index.html#noboot">&#9664; Arcade</a>
    <h1>SAND BOX</h1>
    <div class="stats">
      <span>PARTICLES <b id="count">0</b></span>
      <span>FPS <b id="fps">0</b></span>
    </div>
  </header>

  <div class="layout">
    <div class="stage">
      <canvas id="game" width="200" height="125"></canvas>
    </div>

    <aside class="panel">
      <h3>ELEMENTS</h3>
      <div class="elements" id="elements"></div>
      <h3>BRUSH SIZE: <span id="brush-val">4</span></h3>
      <input type="range" id="brush" min="1" max="15" value="4">
      <div class="row">
        <button class="btn" id="pause">PAUSE</button>
        <button class="btn" id="step">STEP</button>
      </div>
      <div class="row">
        <button class="btn" id="clear">CLEAR</button>
        <button class="btn" id="demo">DEMO</button>
      </div>
      <p class="info">
        <b>Left drag</b> paint &middot; <b>Right drag</b> erase<br>
        <b>Wheel / [ ]</b> brush size &middot; <b>Space</b> pause<br>
        <b>Under cursor:</b> <span id="hover">EMPTY</span>
      </p>
    </aside>
  </div>

  <p class="help">
    Try: lava + water = stone &amp; steam &middot; fire + gunpowder = boom &middot;
    acid eats almost anything &middot; plants grow in water &middot; ice freezes water.
  </p>

  <script src="../../shared/retro.js"></script>
  <script src="sandbox.js"></script>
</body>
</html>
